# Generate the Xcode project on macOS with:  brew install xcodegen && cd iosApp && xcodegen
name: TowerScope
options:
  bundleIdPrefix: io.towerscope
  deploymentTarget:
    iOS: "16.0"
targets:
  TowerScope:
    type: application
    platform: iOS
    sources:
      - TowerScope
    info:
      path: TowerScope/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.towerscope.ios
        PRODUCT_NAME: TowerScope
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared"
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
