<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TowerScope Live: video tour</title>
  <meta name="description" content="A 43-second tour of TowerScope Live, the cell tower and signal analyzer for Android.">
  <meta property="og:title" content="TowerScope Live: video tour">
  <meta property="og:image" content="poster.png">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --bg: #050a14; --fg: #e7eef9; --muted: #94a3b8; --accent: #22d3ee; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 30% 40%, #0e2d44, var(--bg) 70%);
           color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; }
    h1 { font-size: clamp(1.4rem, 4vw, 2rem); margin: 0 0 16px; font-weight: 700; }
    h1 span { color: var(--accent); font-weight: 400; }
    video { width: 100%; max-width: 1100px; aspect-ratio: 16 / 9; border-radius: 14px; background: #000;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
    p { color: var(--muted); margin: 16px 0 0; text-align: center; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <h1>Tower<span>Scope</span> Live</h1>
  <video controls playsinline preload="metadata" poster="poster.png">
    <source src="TowerScope-Live.mp4" type="video/mp4">
    <track kind="subtitles" src="TowerScope-Live.vtt" srclang="en" label="English">
    Your browser can't play this video. <a href="TowerScope-Live.mp4">Download the MP4</a>.
  </video>
  <p>
    <a href="https://github.com/garyleebairdjr-cmyk/towerscope-live">Project on GitHub</a> ·
    <a href="https://github.com/garyleebairdjr-cmyk/towerscope-live/releases/latest">Download for Android</a> ·
    <a href="https://github.com/garyleebairdjr-cmyk/towerscope-live/wiki">User guide</a>
  </p>
</body>
</html>
