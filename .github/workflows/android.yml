name: Build & release Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish GitHub Releases

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners ship the Android SDK; just add the platform this project compiles against.
      - name: Install Android SDK packages
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (RF math, diagnostics)
        run: ./gradlew :shared:testAndroidHostTest --no-daemon

      - name: Decode release signing key
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TOWERSCOPE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set: building with a throwaway debug key and skipping the GitHub Release (so users never get an APK that can't update)."
          fi

      - name: Build release APK
        env:
          TOWERSCOPE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TOWERSCOPE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TOWERSCOPE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Name the APK
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "dist/TowerScope-Live-1.0.${VERSION_CODE}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: TowerScope-Live-1.0.${{ github.run_number }}
          path: dist/*.apk

      - name: Publish GitHub Release
        # Only publish builds signed with the permanent key; otherwise updates wouldn't install over each other.
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_RELEASE_KEY == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG="v1.0.${VERSION_CODE}"
          gh release create "$TAG" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "TowerScope Live 1.0.${VERSION_CODE}" \
            --latest \
            --notes "Automatic build of ${GITHUB_SHA::7}.

          **Install on Android:** download the APK below on your phone and open it. See [installation instructions](https://github.com/${GITHUB_REPOSITORY}#install-on-android-no-app-store).

          Changes: ${COMMIT_MSG}"
