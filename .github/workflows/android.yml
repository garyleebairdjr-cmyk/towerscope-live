name: Build & release Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish GitHub Releases

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
      # Bump VERSION_PREFIX / change CHANNEL (pre-beta → beta → stable) when the app graduates.
      VERSION_NAME: 0.9.${{ github.run_number }}
      CHANNEL: pre-beta
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners ship the Android SDK; just add the platform this project compiles against.
      - name: Install Android SDK packages
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (RF math, diagnostics)
        run: ./gradlew :shared:testAndroidHostTest --no-daemon

      - name: Decode release signing key
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TOWERSCOPE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set: building with a throwaway debug key and skipping the GitHub Release (so users never get an APK that can't update)."
          fi

      - name: Build release APK
        env:
          TOWERSCOPE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TOWERSCOPE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TOWERSCOPE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # GitHub releases carry the open-source edition (io.towerscope.android), so existing installs keep
        # updating in place. The Play edition (io.towerscope.live) is built with bundlePlayRelease and
        # uploaded to Play Console by hand for now.
        run: ./gradlew :androidApp:assembleFossRelease --no-daemon

      - name: Name the APK
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/foss/release/androidApp-foss-release.apk "dist/TowerScope-Live-${VERSION_NAME}.apk"
          # Fixed-name copy so .../releases/latest/download/TowerScope-Live.apk always works.
          cp androidApp/build/outputs/apk/foss/release/androidApp-foss-release.apk "dist/TowerScope-Live.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: TowerScope-Live-0.9.${{ github.run_number }}
          path: dist/*.apk

      - name: Publish GitHub Release
        # Only publish builds signed with the permanent key; otherwise updates wouldn't install over each other.
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_RELEASE_KEY == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Subject line of the commit being released (works for pushes and manual runs).
          COMMIT_MSG="$(git log -1 --pretty=%s)"
          TITLE="TowerScope Live ${VERSION_NAME}"
          [ "$CHANNEL" != "stable" ] && TITLE="$TITLE $CHANNEL"
          gh release create "v${VERSION_NAME}" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --latest \
            --notes "Automatic ${CHANNEL} build of ${GITHUB_SHA::7}.

          **Install on Android:** open this page on your phone and tap \`TowerScope-Live-${VERSION_NAME}.apk\` below. First time? See [Installing on Android](https://github.com/${GITHUB_REPOSITORY}/wiki/Installing-on-Android).

          Changes: ${COMMIT_MSG}"

      - name: Update wiki Download page
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_RELEASE_KEY == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::warning::Wiki not initialised yet; skipping the Download page update."
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | python3 .github/scripts/wiki_downloads.py "$GITHUB_REPOSITORY" > wiki/Download.md
          cd wiki
          if git diff --quiet -- Download.md; then echo "Download page unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Download.md
          git commit -q -m "Update Download page for v${VERSION_NAME}"
          git push -q || echo "::warning::Could not push to the wiki."
