# Generate the Xcode project on macOS with:  brew install xcodegen && cd iosApp && xcodegen
# Building for the App Store needs Xcode 26 or later and the iOS 26 SDK (Apple's rule since April 28, 2026).
# The deployment target below is only the oldest iOS version the app runs on.
name: TowerScope
options:
  bundleIdPrefix: io.towerscope
  deploymentTarget:
    iOS: "16.0"
targets:
  TowerScope:
    type: application
    platform: iOS
    sources:
      - path: TowerScope
        excludes:
          - "*.storekit" # local StoreKit testing only; never shipped
    info:
      path: TowerScope/Info.plist
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        # Bundle ID and Team ID come from Signing.xcconfig (placeholders) and Signing.local.xcconfig (yours, gitignored).
        PRODUCT_NAME: TowerScope
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared"
        # The shared Kotlin framework has no x86_64 simulator target (only iosSimulatorArm64),
        # so simulator builds must be arm64-only. Generic simulator builds otherwise fail with
        # "Unknown iOS simulator arch: 'x86_64'".
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
schemes:
  TowerScope:
    build:
      targets:
        TowerScope: all
    run:
      config: Debug
      # Lets you test the trial and unlock in the simulator without App Store Connect.
      storeKitConfiguration: TowerScope/TowerScope.storekit
    archive:
      config: Release
